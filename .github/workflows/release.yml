name: Release builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rr-game") | .version')
            version="$base-${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Build release executable
        run: cargo build -p rr-game --release --locked
      - name: Validate levels
        run: cargo run -p rr-tools --release --locked -- validate (Get-ChildItem assets/levels/*.ron).FullName
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: iscc /DAppVersion=$env:VERSION installer\rex-ruckus.iss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rex-ruckus-windows-installer
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Build release executable
        run: cargo build -p rr-game --release --locked
      - name: Package tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-linux.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rex-ruckus-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rex-ruckus-windows-installer
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rex-ruckus-linux-x86_64
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Build release executable
        run: cargo build -p rr-game --release --locked
      - name: Validate levels
        run: cargo run -p rr-tools --release --locked -- validate (Get-ChildItem assets/levels/*.ron).FullName
      - name: Determine version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $base = ($meta.packages | Where-Object name -eq 'rr-game').version
            $version = "$base-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} installer\rex-ruckus.iss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rex-ruckus-windows-installer
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rex-ruckus-windows-installer
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

name: Nightly proptests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proptests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROPTEST_CASES: "20000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: High-count property tests
        run: cargo test -p rr-core --release --test movement_props --test collide_props --test trace_props

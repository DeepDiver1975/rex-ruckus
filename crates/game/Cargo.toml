[package]
name = "rr-game"
edition.workspace = true
license.workspace = true
version.workspace = true

build = "build.rs"

[[bin]]
name = "rex-ruckus"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19", features = ["jpeg", "wav", "serialize"] }
rr-core = { path = "../core" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
directories = "6"
# The window icon: the same versions Bevy already pulls in.
image = { version = "0.25", default-features = false, features = ["png"] }
rr-net = { path = "../net" }
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[workspace]
resolver = "3"
members = ["crates/core", "crates/game", "crates/tools"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

# Bevy is very slow unoptimised; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Dependencies carry no debuginfo: keeps debug test binaries small.
debug = false
